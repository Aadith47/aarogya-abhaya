<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password | AAROGYA ABHAYA</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(120deg,#0f766e,#ecfeff);
}

.box{
    width:380px;
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

h2{
    text-align:center;
    color:#0f766e;
    margin-bottom:20px;
}

.group{
    margin-bottom:15px;
}

.group input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #94a3b8;
}

.group button{
    width:100%;
    padding:12px;
    background:#0f766e;
    color:white;
    border:none;
    border-radius:25px;
    font-size:15px;
    cursor:pointer;
}

.group button:hover{
    background:#115e59;
}

.back{
    text-align:center;
    margin-top:15px;
}

.back a{
    text-decoration:none;
    color:#0f766e;
}
</style>
</head>

<body>

<div class="box">
    <h2>Forgot Password</h2>

    <div class="group">
        <input id="fpUsername" placeholder="Enter username or email">
    </div>

    <div class="group">
        <button onclick="sendOTP()">Send OTP</button>
    </div>

    <div class="group">
        <input id="fpOtp" placeholder="Enter OTP">
    </div>

    <div class="group">
        <input id="fpNewPass" type="password" placeholder="New password">
    </div>

    <div class="group">
        <button onclick="resetPassword()">Reset Password</button>
    </div>

    <div class="back">
        <a href="login.html">← Back to Login</a>
    </div>
</div>

<script>
async function sendOTP(){
    const username = fpUsername.value.trim();
    if(!username) return alert("Enter username");

    const res = await fetch("/forgot-password",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username})
    });

    const data = await res.json();
    alert(data.message);
}

async function resetPassword(){
    const username = fpUsername.value.trim();
    const otp = fpOtp.value.trim();
    const newPassword = fpNewPass.value.trim();

    if(!username || !otp || !newPassword){
        return alert("Fill all fields");
    }

    const res = await fetch("/reset-password",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username,otp,newPassword})
    });

    const data = await res.json();
    alert(data.message);

    if(res.ok){
        window.location.href = "login.html";
    }
}
</script>

</body>
</html>
